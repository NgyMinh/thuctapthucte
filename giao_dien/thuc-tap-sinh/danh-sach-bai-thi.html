<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách Bài thi Trắc nghiệm - FPT Software</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/giao-dien/chung/fpt-style.css">
</head>
<body class="bg-[#F8FAFC] text-slate-800">

    <!-- Header Navbar -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <a href="/giao-dien/thuc-tap-sinh/tong-quan.html" class="flex items-center space-x-2">
                    <span class="px-2.5 py-0.5 bg-[#F37021] text-white font-black text-xl rounded">FPT</span>
                    <span class="text-xl font-bold text-[#002C6C]">Software</span>
                </a>
            </div>

            <nav class="hidden md:flex items-center space-x-1 lg:space-x-2 text-sm font-medium">
                <a href="/giao-dien/thuc-tap-sinh/tong-quan.html" class="px-3 py-2 text-slate-600 hover:text-[#002C6C] hover:bg-slate-100 rounded-lg transition">Trang tổng quan</a>
                <a href="/giao-dien/thuc-tap-sinh/khoa-hoc.html" class="px-3 py-2 text-slate-600 hover:text-[#002C6C] hover:bg-slate-100 rounded-lg transition">Khóa học của tôi</a>
                <a href="/giao-dien/thuc-tap-sinh/danh-sach-bai-thi.html" class="px-3 py-2 text-[#F37021] bg-orange-50 rounded-lg font-semibold">Bài thi đánh giá</a>
                <a href="/giao-dien/thuc-tap-sinh/lich-su-thi.html" class="px-3 py-2 text-slate-600 hover:text-[#002C6C] hover:bg-slate-100 rounded-lg transition">Lịch sử làm bài</a>
            </nav>

            <div class="flex items-center space-x-3">
                <a href="/giao-dien/thuc-tap-sinh/ho-so.html" class="flex items-center space-x-2 text-left hover:opacity-80 transition">
                    <div class="w-9 h-9 rounded-full bg-[#002C6C] text-white flex items-center justify-center font-bold text-sm" id="avatar-chu-cai">A</div>
                    <div class="hidden sm:block">
                        <div class="text-xs font-bold text-slate-800" id="header-ten-nguoi-dung">Thực tập sinh</div>
                        <div class="text-[11px] text-slate-500" id="header-nhom">Fresher FPT</div>
                    </div>
                </a>
                <button onclick="dangXuatHeThong()" title="Đăng xuất" class="p-2 text-slate-400 hover:text-rose-600 rounded-lg hover:bg-slate-100 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Tiêu đề trang -->
        <div class="mb-8 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
            <div>
                <h1 class="text-2xl font-bold text-slate-900">Bài kiểm tra & Đánh giá năng lực</h1>
                <p class="text-sm text-slate-500 mt-1">Hệ thống bài thi trắc nghiệm định kỳ nhằm đánh giá chuẩn đầu ra chuyên môn tại FPT Software.</p>
            </div>
            <div>
                <a href="/giao-dien/thuc-tap-sinh/lich-su-thi.html" class="px-4 py-2 bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 text-xs font-semibold rounded-xl shadow-sm transition inline-flex items-center space-x-2">
                    <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <span>Xem lại kết quả & Lịch sử thi</span>
                </a>
            </div>
        </div>

        <!-- Lưới danh sách các đề thi (Card Layout) -->
        <div id="luoi-de-thi" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="the-card-fpt p-8 text-center text-slate-400 col-span-full">Đang tải danh sách bài thi...</div>
        </div>
    </main>

    <script src="/giao-dien/chung/ungDung.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (!kiemTraBaoVeTrang('thuc_tap_sinh')) return;
            caiDatThongTinNguoiDungHeader();

            const nguoiDung = layThongTinNguoiDung();
            if (nguoiDung) {
                document.getElementById('avatar-chu-cai').textContent = nguoiDung.hoTen.charAt(0).toUpperCase();
            }

            await taiDanhSachDeThi();
        });

        async function taiDanhSachDeThi() {
            const khungChua = document.getElementById('luoi-de-thi');
            const ketQua = await goiApi('/api/de-thi');

            if (!ketQua.thanhCong || ketQua.duLieu.length === 0) {
                khungChua.innerHTML = `
                    <div class="the-card-fpt p-12 text-center text-slate-400 col-span-full">
                        <svg class="w-12 h-12 mx-auto text-slate-300 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                        <h3 class="text-base font-semibold text-slate-700">Chưa có bài thi nào</h3>
                        <p class="text-xs text-slate-500 mt-1">Các bài thi đánh giá năng lực sẽ xuất hiện khi Mentor kích hoạt.</p>
                    </div>
                `;
                return;
            }

            khungChua.innerHTML = ketQua.duLieu.map(dt => {
                let huyHieuTrangThai = '';
                let nutHanhDong = '';

                if (dt.so_lan_da_thi > 0) {
                    if (dt.ket_qua_gan_nhat === 'dat') {
                        huyHieuTrangThai = `<span class="px-2.5 py-1 bg-emerald-100 text-emerald-700 text-xs font-bold rounded-lg flex items-center space-x-1"><span>✓ ĐÃ ĐẠT (${dt.diem_thi_gan_nhat} đ)</span></span>`;
                    } else {
                        huyHieuTrangThai = `<span class="px-2.5 py-1 bg-rose-100 text-rose-700 text-xs font-bold rounded-lg flex items-center space-x-1"><span>✕ CHƯA ĐẠT (${dt.diem_thi_gan_nhat} đ)</span></span>`;
                    }
                    nutHanhDong = `
                        <div class="flex items-center space-x-2 w-full">
                            <a href="/giao-dien/thuc-tap-sinh/phong-thi.html?idDeThi=${dt.id}" 
                               class="flex-1 py-2.5 bg-slate-100 hover:bg-[#F37021] text-slate-700 hover:text-white font-semibold text-xs rounded-xl shadow-sm transition text-center">
                               Thi lại để cải thiện
                            </a>
                        </div>
                    `;
                } else {
                    huyHieuTrangThai = `<span class="px-2.5 py-1 bg-amber-100 text-amber-700 text-xs font-bold rounded-lg">Chưa làm bài</span>`;
                    nutHanhDong = `
                        <a href="/giao-dien/thuc-tap-sinh/phong-thi.html?idDeThi=${dt.id}" 
                           class="w-full py-2.5 bg-[#F37021] hover:bg-[#E05D10] text-white font-semibold text-xs rounded-xl shadow-sm shadow-orange-500/20 transition flex items-center justify-center space-x-1.5">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                            <span>Bắt đầu làm bài thi</span>
                        </a>
                    `;
                }

                return `
                    <div class="the-card-fpt p-6 flex flex-col justify-between">
                        <div>
                            <!-- Header thẻ -->
                            <div class="flex items-center justify-between mb-3">
                                <span class="text-xs font-bold text-[#002C6C] bg-blue-50 px-2.5 py-1 rounded-md">
                                    ${dt.ma_de_thi}
                                </span>
                                ${huyHieuTrangThai}
                            </div>

                            <!-- Tên đề thi -->
                            <h3 class="text-base font-bold text-slate-900 line-clamp-2 leading-snug">${dt.tieu_de_de_thi}</h3>
                            <p class="text-xs text-slate-500 mt-2 line-clamp-2 leading-relaxed">${dt.mo_ta || 'Bài kiểm tra trắc nghiệm đánh giá năng lực nghiệp vụ.'}</p>

                            <!-- Khối thông số kỹ thuật đề thi -->
                            <div class="mt-5 p-3.5 bg-slate-50 rounded-xl space-y-2 text-xs border border-slate-100">
                                <div class="flex items-center justify-between text-slate-600">
                                    <span class="flex items-center"><span class="mr-1.5">⏱️</span> Thời gian làm bài:</span>
                                    <strong class="text-slate-800">${dt.thoi_gian_lam_bai_phut} phút</strong>
                                </div>
                                <div class="flex items-center justify-between text-slate-600">
                                    <span class="flex items-center"><span class="mr-1.5">📝</span> Số lượng câu hỏi:</span>
                                    <strong class="text-slate-800">${dt.so_cau_hoi} câu</strong>
                                </div>
                                <div class="flex items-center justify-between text-slate-600">
                                    <span class="flex items-center"><span class="mr-1.5">🎯</span> Điểm chuẩn để đạt:</span>
                                    <strong class="text-emerald-600">${dt.diem_chuan_dat} / 10.0 đ</strong>
                                </div>
                                <div class="flex items-center justify-between text-slate-600">
                                    <span class="flex items-center"><span class="mr-1.5">🔀</span> Cơ chế thi:</span>
                                    <strong class="text-slate-700">Trộn đề tự động</strong>
                                </div>
                            </div>
                        </div>

                        <!-- Nút thao tác -->
                        <div class="mt-6 pt-4 border-t border-slate-100">
                            ${nutHanhDong}
                        </div>
                    </div>
                `;
            }).join('');
        }
    </script>
</body>
</html>
