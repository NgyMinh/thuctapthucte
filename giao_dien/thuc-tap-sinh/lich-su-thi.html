<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch sử Bài thi Đã làm - FPT Software</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/giao-dien/chung/fpt-style.css">
</head>
<body class="bg-[#F8FAFC] text-slate-800">

    <!-- Header Navbar -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <a href="/giao-dien/thuc-tap-sinh/tong-quan.html" class="flex items-center space-x-2">
                    <span class="px-2.5 py-0.5 bg-[#F37021] text-white font-black text-xl rounded">FPT</span>
                    <span class="text-xl font-bold text-[#002C6C]">Software</span>
                </a>
            </div>

            <nav class="hidden md:flex items-center space-x-1 lg:space-x-2 text-sm font-medium">
                <a href="/giao-dien/thuc-tap-sinh/tong-quan.html" class="px-3 py-2 text-slate-600 hover:text-[#002C6C] hover:bg-slate-100 rounded-lg transition">Trang tổng quan</a>
                <a href="/giao-dien/thuc-tap-sinh/khoa-hoc.html" class="px-3 py-2 text-slate-600 hover:text-[#002C6C] hover:bg-slate-100 rounded-lg transition">Khóa học của tôi</a>
                <a href="/giao-dien/thuc-tap-sinh/danh-sach-bai-thi.html" class="px-3 py-2 text-slate-600 hover:text-[#002C6C] hover:bg-slate-100 rounded-lg transition">Bài thi đánh giá</a>
                <a href="/giao-dien/thuc-tap-sinh/lich-su-thi.html" class="px-3 py-2 text-[#F37021] bg-orange-50 rounded-lg font-semibold">Lịch sử làm bài</a>
            </nav>

            <div class="flex items-center space-x-3">
                <a href="/giao-dien/thuc-tap-sinh/ho-so.html" class="w-9 h-9 rounded-full bg-[#002C6C] text-white flex items-center justify-center font-bold text-sm" id="avatar-chu-cai">A</a>
                <button onclick="dangXuatHeThong()" title="Đăng xuất" class="p-2 text-slate-400 hover:text-rose-600 rounded-lg hover:bg-slate-100 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Tiêu đề trang -->
        <div class="mb-8">
            <h1 class="text-2xl font-bold text-slate-900">Lịch sử các lần thi trắc nghiệm</h1>
            <p class="text-sm text-slate-500 mt-1">Theo dõi điểm số tích lũy và xem lại chi tiết bài làm của từng lần đánh giá năng lực.</p>
        </div>

        <!-- Bảng danh sách bài thi (Table Layout với khoảng cách hàng cột rộng rãi) -->
        <div class="the-card-fpt overflow-hidden bg-white border border-slate-200">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs sm:text-sm">
                    <thead class="bg-slate-50 border-b border-slate-200 text-slate-500 font-semibold uppercase tracking-wider text-[11px]">
                        <tr>
                            <th class="py-4 px-6">Mã bài làm</th>
                            <th class="py-4 px-6">Tên đề thi</th>
                            <th class="py-4 px-6">Thời gian nộp bài</th>
                            <th class="py-4 px-6 text-center">Điểm số</th>
                            <th class="py-4 px-6 text-center">Trạng thái</th>
                            <th class="py-4 px-6 text-right">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="bang-lich-su-body" class="divide-y divide-slate-100">
                        <tr>
                            <td colspan="6" class="py-12 text-center text-slate-400">Đang tải lịch sử thi...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="/giao-dien/chung/ungDung.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (!kiemTraBaoVeTrang('thuc_tap_sinh')) return;
            caiDatThongTinNguoiDungHeader();

            const nguoiDung = layThongTinNguoiDung();
            if (nguoiDung) {
                document.getElementById('avatar-chu-cai').textContent = nguoiDung.hoTen.charAt(0).toUpperCase();
            }

            await taiLichSuThi();
        });

        async function taiLichSuThi() {
            const tbody = document.getElementById('bang-lich-su-body');
            const ketQua = await goiApi('/api/bai-thi/lich-su');

            if (!ketQua.thanhCong || ketQua.duLieu.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" class="py-12 text-center text-slate-400">
                            Bạn chưa tham gia bài thi đánh giá nào.
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = ketQua.duLieu.map(item => {
                const laDat = item.ket_qua === 'dat';
                const huyHieu = laDat 
                    ? `<span class="px-3 py-1 bg-emerald-100 text-emerald-800 font-bold text-xs rounded-full inline-block">ĐẠT CHUẨN</span>`
                    : `<span class="px-3 py-1 bg-rose-100 text-rose-800 font-bold text-xs rounded-full inline-block">CHƯA ĐẠT</span>`;

                return `
                    <tr class="hover:bg-slate-50/80 transition">
                        <td class="py-4 px-6 font-mono text-xs text-slate-500 font-medium">${item.ma_bai_thi}</td>
                        <td class="py-4 px-6">
                            <strong class="font-bold text-slate-900 block">${item.tieu_de_de_thi}</strong>
                            <span class="text-xs text-slate-400">${item.ten_khoa_hoc || 'Đánh giá độc lập'}</span>
                        </td>
                        <td class="py-4 px-6 text-slate-600">${dinhDangNgayGio(item.thoi_gian_nop_bai)}</td>
                        <td class="py-4 px-6 text-center font-extrabold text-base ${laDat ? 'text-emerald-600' : 'text-rose-600'}">
                            ${item.tong_diem_dat_duoc} / 10.0
                        </td>
                        <td class="py-4 px-6 text-center">${huyHieu}</td>
                        <td class="py-4 px-6 text-right">
                            <a href="/giao-dien/thuc-tap-sinh/ket-qua-thi.html?id=${item.id}" 
                               class="px-3.5 py-1.5 bg-slate-100 hover:bg-[#F37021] text-slate-700 hover:text-white font-semibold text-xs rounded-lg transition inline-flex items-center space-x-1">
                                <span>Xem chi tiết</span>
                            </a>
                        </td>
                    </tr>
                `;
            }).join('');
        }
    </script>
</body>
</html>
