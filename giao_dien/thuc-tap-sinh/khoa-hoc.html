<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khóa học Đào tạo của tôi - FPT Software</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/giao-dien/chung/fpt-style.css">
</head>
<body class="bg-[#F8FAFC] text-slate-800">

    <!-- Header Navbar -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <a href="/giao-dien/thuc-tap-sinh/tong-quan.html" class="flex items-center space-x-2">
                    <span class="px-2.5 py-0.5 bg-[#F37021] text-white font-black text-xl rounded">FPT</span>
                    <span class="text-xl font-bold text-[#002C6C]">Software</span>
                </a>
            </div>

            <nav class="hidden md:flex items-center space-x-1 lg:space-x-2 text-sm font-medium">
                <a href="/giao-dien/thuc-tap-sinh/tong-quan.html" class="px-3 py-2 text-slate-600 hover:text-[#002C6C] hover:bg-slate-100 rounded-lg transition">Trang tổng quan</a>
                <a href="/giao-dien/thuc-tap-sinh/khoa-hoc.html" class="px-3 py-2 text-[#F37021] bg-orange-50 rounded-lg font-semibold">Khóa học của tôi</a>
                <a href="/giao-dien/thuc-tap-sinh/danh-sach-bai-thi.html" class="px-3 py-2 text-slate-600 hover:text-[#002C6C] hover:bg-slate-100 rounded-lg transition">Bài thi đánh giá</a>
                <a href="/giao-dien/thuc-tap-sinh/lich-su-thi.html" class="px-3 py-2 text-slate-600 hover:text-[#002C6C] hover:bg-slate-100 rounded-lg transition">Lịch sử làm bài</a>
            </nav>

            <div class="flex items-center space-x-3">
                <a href="/giao-dien/thuc-tap-sinh/ho-so.html" class="flex items-center space-x-2 text-left hover:opacity-80 transition">
                    <div class="w-9 h-9 rounded-full bg-[#002C6C] text-white flex items-center justify-center font-bold text-sm" id="avatar-chu-cai">A</div>
                    <div class="hidden sm:block">
                        <div class="text-xs font-bold text-slate-800" id="header-ten-nguoi-dung">Thực tập sinh</div>
                        <div class="text-[11px] text-slate-500" id="header-nhom">Fresher FPT</div>
                    </div>
                </a>
                <button onclick="dangXuatHeThong()" title="Đăng xuất" class="p-2 text-slate-400 hover:text-rose-600 rounded-lg hover:bg-slate-100 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Tiêu đề trang -->
        <div class="mb-8">
            <h1 class="text-2xl font-bold text-slate-900">Khóa học được phân công</h1>
            <p class="text-sm text-slate-500 mt-1">Danh sách các chương trình đào tạo chuyên môn bạn đang theo học tại FPT Software.</p>
        </div>

        <!-- Lưới danh sách khóa học (Card-based UI) -->
        <div id="luoi-khoa-hoc" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="the-card-fpt p-8 text-center text-slate-400 col-span-full">Đang tải danh sách khóa học...</div>
        </div>
    </main>

    <script src="/giao-dien/chung/ungDung.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (!kiemTraBaoVeTrang('thuc_tap_sinh')) return;
            caiDatThongTinNguoiDungHeader();

            const nguoiDung = layThongTinNguoiDung();
            if (nguoiDung) {
                document.getElementById('avatar-chu-cai').textContent = nguoiDung.hoTen.charAt(0).toUpperCase();
            }

            await taiKhoaHoc();
        });

        async function taiKhoaHoc() {
            const khungChua = document.getElementById('luoi-khoa-hoc');
            const ketQua = await goiApi('/api/khoa-hoc');

            if (!ketQua.thanhCong || ketQua.duLieu.length === 0) {
                khungChua.innerHTML = `
                    <div class="the-card-fpt p-12 text-center text-slate-400 col-span-full">
                        <svg class="w-12 h-12 mx-auto text-slate-300 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                        <h3 class="text-base font-semibold text-slate-700">Chưa có khóa học nào</h3>
                        <p class="text-xs text-slate-500 mt-1">Mentor phụ trách sẽ phân công khóa học cho nhóm của bạn sớm nhất.</p>
                    </div>
                `;
                return;
            }

            khungChua.innerHTML = ketQua.duLieu.map(kh => `
                <div class="the-card-fpt overflow-hidden flex flex-col justify-between group">
                    <div>
                        <!-- Ảnh đại diện khóa học -->
                        <div class="relative h-44 overflow-hidden bg-slate-100">
                            <img src="${kh.anh_khoa_hoc}" alt="${kh.tieu_de}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                            <span class="absolute top-3 left-3 bg-[#002C6C]/90 backdrop-blur-sm text-white text-[11px] font-bold px-2.5 py-1 rounded-md shadow-sm">
                                ${kh.ma_khoa_hoc}
                            </span>
                            <span class="absolute top-3 right-3 bg-white/90 backdrop-blur-sm text-slate-700 text-[11px] font-semibold px-2 py-0.5 rounded shadow-sm">
                                ⏱️ ${kh.thoi_luong_gio} giờ học
                            </span>
                        </div>

                        <!-- Nội dung thông tin -->
                        <div class="p-6">
                            <h3 class="text-base font-bold text-slate-900 group-hover:text-[#F37021] transition line-clamp-2">
                                <a href="/giao-dien/thuc-tap-sinh/chi-tiet-khoa-hoc.html?id=${kh.id}">${kh.tieu_de}</a>
                            </h3>
                            <p class="text-xs text-slate-500 mt-2 line-clamp-2 leading-relaxed">${kh.mo_ta}</p>
                            
                            <!-- Thống kê bài học -->
                            <div class="mt-4 pt-4 border-t border-slate-100 flex items-center justify-between text-xs text-slate-500">
                                <span>Đã học: <strong class="text-slate-800">${kh.so_bai_da_hoan_thanh || 0} / ${kh.tong_so_bai_hoc || 0}</strong> bài</span>
                                <span class="font-bold text-emerald-600">${kh.phanTramTienDo}%</span>
                            </div>

                            <!-- Thanh tiến độ -->
                            <div class="mt-2 w-full bg-slate-100 rounded-full h-2 overflow-hidden">
                                <div class="bg-emerald-500 h-2 rounded-full transition-all duration-500" style="width: ${kh.phanTramTienDo}%"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Nút thao tác -->
                    <div class="p-6 pt-0">
                        <a href="/giao-dien/thuc-tap-sinh/chi-tiet-khoa-hoc.html?id=${kh.id}" 
                           class="w-full py-2.5 px-4 bg-[#F37021] hover:bg-[#E05D10] text-white font-semibold text-xs rounded-xl shadow-sm transition flex items-center justify-center space-x-2">
                            <span>Vào học ngay</span>
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                        </a>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
